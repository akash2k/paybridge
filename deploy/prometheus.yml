global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "paybridge"
    static_configs:
      - targets: ["otel-collector:8889"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "^paybridge_.*"
        action: keep

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
