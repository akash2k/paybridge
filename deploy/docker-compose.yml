version: "3.9"

services:

  # ─── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       paybridge
      POSTGRES_USER:     paybridge
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paybridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID:                        1
      KAFKA_ZOOKEEPER_CONNECT:                zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS:             PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:        "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # ─── Observability ────────────────────────────────────────────────────────────

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel/config.yml:ro
    ports:
      - "4317:4317"   # gRPC OTLP
      - "4318:4318"   # HTTP OTLP
    depends_on:
      - jaeger
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.59
    ports:
      - "16686:16686"  # Jaeger UI
      - "14250:14250"  # gRPC collector
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED:  "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  # ─── Application Services ─────────────────────────────────────────────────────

  fraud-stub:
    build:
      context: ..
      dockerfile: src/PayBridge.FraudStub/Dockerfile
    ports:
      - "8081:8081"
    environment:
      ASPNETCORE_URLS:   "http://+:8081"
      Otel__Endpoint:    "http://otel-collector:4317"
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health || exit 1"]
      interval: 10s
      retries: 5

  provider-stub:
    build:
      context: ..
      dockerfile: src/PayBridge.ProviderStub/Dockerfile
    ports:
      - "8082:8082"
    environment:
      ASPNETCORE_URLS:        "http://+:8082"
      Otel__Endpoint:         "http://otel-collector:4317"
      WebhookReceiver__Url:   "http://webhook-receiver:8083"
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/health || exit 1"]
      interval: 10s
      retries: 5

  webhook-receiver:
    build:
      context: ..
      dockerfile: src/PayBridge.WebhookReceiver/Dockerfile
    ports:
      - "8083:8083"
    environment:
      ASPNETCORE_URLS:          "http://+:8083"
      Redis__ConnectionString:  "redis:6379"
      Kafka__BootstrapServers:  "kafka:9092"
      Otel__Endpoint:           "http://otel-collector:4317"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/health || exit 1"]
      interval: 10s
      retries: 5

  payment-api:
    build:
      context: ..
      dockerfile: src/PayBridge.PaymentApi/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS:                       "http://+:8080"
      ConnectionStrings__Postgres:           "Host=postgres;Port=5432;Database=paybridge;Username=paybridge;Password=secret"
      Redis__ConnectionString:               "redis:6379"
      Kafka__BootstrapServers:              "kafka:9092"
      FraudService__Address:                "http://fraud-stub:8081"
      ProviderStub__BaseUrl:                "http://provider-stub:8082"
      Otel__Endpoint:                       "http://otel-collector:4317"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      fraud-stub:
        condition: service_healthy
      provider-stub:
        condition: service_healthy
      webhook-receiver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/live || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s

  settlement-consumer:
    build:
      context: ..
      dockerfile: src/PayBridge.SettlementConsumer/Dockerfile
    environment:
      ASPNETCORE_URLS:                "http://+:8084"
      ConnectionStrings__Postgres:    "Host=postgres;Port=5432;Database=paybridge;Username=paybridge;Password=secret"
      Kafka__BootstrapServers:       "kafka:9092"
      Otel__Endpoint:                "http://otel-collector:4317"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
